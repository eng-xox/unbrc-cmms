<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMMS Fleet System</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e17;--bgCard:#111827;--bgCard2:#1a2235;--border:#1e3a5f;--primary:#0a7a8c;--primaryLight:#0ea5b7;--accent:#0d6efd;--text:#e2e8f0;--textMuted:#94a3b8;--textDim:#64748b;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;--gradStart:#0a5a8c;--gradEnd:#0a8a8c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);direction:rtl}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input,select,textarea,button{font-family:'Tajawal',sans-serif}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease-out}
.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--bgCard);border-left:1px solid var(--border);position:fixed;top:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;transition:width .3s}
.sidebar.collapsed{width:70px}
.sidebar.collapsed .hide-c{display:none}
.sidebar.collapsed .nav-btn{justify-content:center;padding:10px 0}
.main{flex:1;margin-right:260px;transition:margin .3s}
.main.expanded{margin-right:70px}
.sidebar-header{padding:20px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:none;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:all .2s;background:transparent;color:var(--textMuted);border-right:3px solid transparent;font-size:14px;text-align:right}
.nav-btn:hover{background:rgba(10,122,140,.08);color:var(--primaryLight)}
.nav-btn.active{background:rgba(10,122,140,.12);color:var(--primaryLight);border-right-color:var(--primaryLight);font-weight:600}
.topbar{padding:12px 24px;background:var(--bgCard);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar h1{font-size:18px;font-weight:700;margin:0}
.content{padding:24px}
.card{background:var(--bgCard);border-radius:12px;border:1px solid var(--border);padding:20px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:14px}
table{width:100%;border-collapse:separate;border-spacing:0}
th{padding:12px 14px;text-align:right;font-size:12px;font-weight:600;color:var(--textMuted);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bgCard2)}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid rgba(30,58,95,.1);white-space:nowrap}
tr:hover td{background:var(--bgCard2)}
.badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-p{background:linear-gradient(135deg,var(--gradStart),var(--gradEnd));color:#fff}
.btn-p:hover{filter:brightness(1.15)}
.btn-s{background:var(--bgCard2);color:var(--text);border:1px solid var(--border)}
.btn-ok{background:rgba(34,197,94,.12);color:var(--success);border:1px solid rgba(34,197,94,.3)}
.btn-no{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.btn-sm{padding:4px 12px;font-size:12px}
.btn-icon{background:none;border:none;color:var(--textMuted);cursor:pointer;padding:4px}
.btn-block{width:100%;justify-content:center;padding:12px;font-size:15px}
.fg{margin-bottom:14px}
.fl{display:block;font-size:13px;font-weight:500;color:var(--textMuted);margin-bottom:6px}
.fi,.fs,.ft{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bgCard2);color:var(--text);font-size:14px;outline:none}
.fi:focus,.fs:focus{border-color:var(--primaryLight)}
.ft{resize:vertical;min-height:80px}
.modal-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
.modal-box{background:var(--bgCard);border-radius:16px;border:1px solid var(--border);width:540px;max-width:94vw;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:16px;font-weight:700;margin:0}
.modal-body{padding:20px}
.ma{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg) 0%,#0a1628 50%,var(--bg) 100%)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;margin-bottom:24px}
.fleet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:20px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-item{padding:12px;border-radius:8px;background:var(--bgCard2)}
.detail-item small{font-size:11px;color:var(--textDim);display:block;margin-bottom:4px}
.detail-item span{font-size:14px;font-weight:600}
.upload-area{padding:20px;border-radius:8px;border:2px dashed var(--border);text-align:center;cursor:pointer;background:var(--bgCard2)}
.upload-area:hover{border-color:var(--primaryLight)}
.quote-card{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:8px;background:var(--bgCard2);border:1px solid transparent;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.quote-card.selected{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.25)}
.chart-bar-group{display:flex;align-items:flex-end;gap:3px;height:200px;padding-top:20px}
.chart-bar{flex:1;min-width:36px;border-radius:4px 4px 0 0;position:relative;transition:all .3s}
.chart-bar:hover{filter:brightness(1.3)}
.chart-bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--textMuted);white-space:nowrap}
.chart-bar-value{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600}
.pie-chart{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.pie-legend{display:flex;flex-direction:column;gap:6px}
.pie-legend-item{display:flex;align-items:center;gap:8px;font-size:12px}
.pie-legend-dot{width:10px;height:10px;border-radius:50%}
.progress-track{display:flex;gap:4px}
.progress-step{flex:1}
.progress-bar{height:6px;border-radius:3px}
.progress-label{font-size:10px;margin-top:4px;text-align:center}
.notif{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:14px 24px;border-radius:10px;background:var(--bgCard);color:var(--text);font-size:14px;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px;max-width:90vw}
@media(max-width:768px){.sidebar{width:70px!important}.sidebar .hide-c{display:none!important}.sidebar .nav-btn{justify-content:center;padding:10px 0}.main{margin-right:70px!important}.content{padding:14px}.stats-grid,.charts-grid{grid-template-columns:1fr}.fleet-grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}}
</style>
</head>

function hrsFrom(ts){if(!ts)return 0;return Math.round((Date.now()-new Date(ts).getTime())/3600000*10)/10}
function fmtDur(hrs){if(hrs<1)return Math.round(hrs*60)+" دقيقة";if(hrs<24)return Math.round(hrs*10)/10+" ساعة";var d=Math.floor(hrs/24),h=Math.round(hrs%24);return d+" يوم"+(h?" و "+h+" ساعة":"")}

function getDeptHrs(order,dept){if(!order.timeline)return 0;var entries=order.timeline.filter(function(t){return t.dept===dept});if(!entries.length)return 0;var start=new Date(entries[0].at).getTime();var nextIdx=-1;for(var i=0;i<order.timeline.length;i++){if(order.timeline[i]===entries[entries.length-1]){nextIdx=i+1;break}}var end=nextIdx<order.timeline.length?new Date(order.timeline[nextIdx].at).getTime():Date.now();return Math.round((end-start)/3600000*10)/10}

// ===== LIVE TIMER SYSTEM =====
var _timerInterval=null;
function startTimers(){
  if(_timerInterval)clearInterval(_timerInterval);
  _timerInterval=setInterval(updateTimers,1000);
}
function updateTimers(){
  var els=document.querySelectorAll("[data-timer-start]");
  els.forEach(function(el){
    var start=el.getAttribute("data-timer-start");
    if(!start)return;
    var diff=Date.now()-new Date(start).getTime();
    if(diff<0)diff=0;
    var secs=Math.floor(diff/1000);
    var d=Math.floor(secs/86400);
    var h=Math.floor((secs%86400)/3600);
    var m=Math.floor((secs%3600)/60);
    var s=secs%60;
    var txt="";
    if(d>0)txt=d+"<small>ي</small> "+pad(h)+"<small>س</small> "+pad(m)+"<small>د</small> "+pad(s)+"<small>ث</small>";
    else if(h>0)txt=pad(h)+"<small>س</small> "+pad(m)+"<small>د</small> "+pad(s)+"<small>ث</small>";
    else txt=pad(m)+"<small>د</small> "+pad(s)+"<small>ث</small>";
    el.innerHTML=txt;
    // Color based on time
    if(d>=2)el.style.color="#ef4444";
    else if(d>=1||h>=12)el.style.color="#f59e0b";
    else el.style.color="#22c55e";
  });
}
function pad(n){return n<10?"0"+n:String(n)}

function getOrderDeptStart(order){
  if(!order.timeline||!order.timeline.length)return order.createdAt||null;
  return order.timeline[order.timeline.length-1].at;
}

function visNav(){var r=S.user?S.user.role:"";return NAV.filter(function(n){return n.roles.indexOf(r)>=0})}

// ===== NOTIFICATION =====
function notify(msg,type){
  var colors={success:"#22c55e",warning:"#f59e0b",error:"#ef4444",info:"#3b82f6"};
  var c=colors[type]||colors.info;
  var el=document.createElement("div");
  el.className="notif fade-in";
  el.style.borderLeft="4px solid "+c;
  el.innerHTML='<span style="width:8px;height:8px;border-radius:50%;background:'+c+';flex-shrink:0"></span>'+msg;
  document.body.appendChild(el);
  setTimeout(function(){el.style.opacity="0";el.style.transition="opacity .5s";setTimeout(function(){el.remove()},500)},3500);
}

// ===== NOTIFICATION SYSTEM =====
function pushNotif(toRole,msg,refId,icon){
  if(!S.data.notifications)S.data.notifications=[];
  S.data.notifications.push({
    id:gid("N"),to:toRole,message:msg,from:S.user?S.user.name:"النظام",
    date:tod(),time:new Date().toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"}),
    read:false,refId:refId||"",icon:icon||"📋"
  });
  saveData();
}

function getMyNotifs(){
  if(!S.data||!S.data.notifications||!S.user)return[];
  var role=S.user.role;
  return S.data.notifications.filter(function(n){
    return n.to===role||n.to==="all"||(role==="admin");
  });
}

function getUnreadCount(){
  return getMyNotifs().filter(function(n){return!n.read}).length;
}

function markAllRead(){
  var mine=getMyNotifs();
  mine.forEach(function(n){n.read=true});
  saveData();render();
}

function markNotifRead(id){
  var n=S.data.notifications.find(function(x){return x.id===id});
  if(n)n.read=true;
  saveData();render();
}

function clearMyNotifs(){
  if(!S.data.notifications)return;
  var role=S.user.role;
  S.data.notifications=S.data.notifications.filter(function(n){
    return !(n.to===role||n.to==="all"||(role==="admin"));
  });
  saveData();render();
}

// ===== RENDER =====

  var app=document.getElementById("app");
  if(!S.user){app.innerHTML=pgLogin();return}

  h+='<nav class="sidebar-nav">';

  });

  h+='<button style="display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:none;border-radius:8px;cursor:pointer;background:transparent;color:var(--danger);font-size:13px" onclick="doLogout()">'+I.logout+'<span class="hide-c">تسجيل خروج</span></button>';
  h+='</div></aside>';
  // Main
  h+='<main class="main'+(sc2?' expanded':'')+'">';

function pgDashAdmin(d,total,open,closed,avg){
  var af=d.fleet.filter(function(f){return f.status==="نشط"}).length;
  var ls=d.parts.filter(function(p){return p.qty<=p.minQty}).length;
  var pm=d.mrs.filter(function(m){return m.approved===null}).length;
  var stCounts={};d.orders.forEach(function(o){stCounts[o.status]=(stCounts[o.status]||0)+1});
  var maxD=Math.max.apply(null,d.orders.map(function(o){return o.days}).concat([1]));
  var h='<div class="stats-grid">'+statCard("إجمالي الطلبات",total,I.maintenance,"#3b82f6")+statCard("مفتوحة",open,I.alert,"#f59e0b")+statCard("مغلقة",closed,I.check,"#22c55e")+statCard("متوسط الأيام",avg+" يوم",I.status,"#0ea5b7")+statCard("أسطول نشط",af+"/"+d.fleet.length,I.fleet,"#0d6efd")+statCard("مخزون منخفض",ls,I.warehouse,"#ef4444")+statCard("شراء معلقة",pm,I.procurement,"#8b5cf6")+'</div>';
  // Charts
  h+='<div class="charts-grid"><div class="card"><h3>توزيع الحالات</h3><div class="pie-chart"><svg viewBox="0 0 200 200" width="180" height="180">'+renderPie(stCounts)+'</svg><div class="pie-legend">';
  Object.keys(stCounts).forEach(function(k){h+='<div class="pie-legend-item"><div class="pie-legend-dot" style="background:'+sc(k)+'"></div>'+k+' ('+stCounts[k]+')</div>'});
  h+='</div></div></div><div class="card"><h3>أيام الطلبات</h3><div class="chart-bar-group">';
  d.orders.forEach(function(o){var ht=(o.days/maxD)*180;h+='<div class="chart-bar" style="height:'+ht+'px;background:'+dc(o.days)+'"><span class="chart-bar-value">'+o.days+'</span><span class="chart-bar-label">'+o.id+'</span></div>'});
  h+='</div></div></div>';
  // Table
  h+='<div class="card"><h3>جميع الطلبات</h3><table><thead><tr><th>الرقم</th><th>المركبة</th><th>النوع</th><th>السبب</th><th>التاريخ</th><th>أيام</th><th>الحالة</th><th>إغلاق</th></tr></thead><tbody>';
  d.orders.forEach(function(o){h+='<tr><td>'+o.id+'</td><td>'+o.vehicleName+'</td><td>'+bdg(o.type)+'</td><td>'+bdg(o.reason)+'</td><td>'+o.date+'</td><td><b style="color:'+dc(o.days)+'">'+o.days+'</b></td><td>'+bdg(o.status)+'</td><td>'+(o.closedDate||"—")+'</td></tr>'});
  h+='</tbody></table></div>';
  return h;
}

function renderPie(data){
  var entries=Object.keys(data).map(function(k){return{name:k,val:data[k]}});
  var total=entries.reduce(function(a,e){return a+e.val},0);
  if(!total)return'';
  var angle=0,h='';
  entries.forEach(function(e){
    var pct=e.val/total,sa=angle;angle+=pct*360;var ea=angle;
    if(pct>=1){h+='<circle cx="100" cy="100" r="80" fill="'+sc(e.name)+'"/>';return}
    var x1=100+80*Math.cos((sa-90)*Math.PI/180),y1=100+80*Math.sin((sa-90)*Math.PI/180);
    var x2=100+80*Math.cos((ea-90)*Math.PI/180),y2=100+80*Math.sin((ea-90)*Math.PI/180);
    h+='<path d="M100,100 L'+x1+','+y1+' A80,80 0 '+(pct>.5?1:0)+',1 '+x2+','+y2+' Z" fill="'+sc(e.name)+'" opacity=".85"/>';
  });
  return h;
}

function approveQ(mrId,qi){
  if(!isAdmin())return;
  var mr=S.data.mrs.find(function(m){return m.id===mrId});
  if(!mr)return;
  mr.selectedQuote=qi;mr.approved=true;mr.status="بانتظار PO";
  var o=S.data.orders.find(function(x){return x.id===mr.moId});
  if(o)addTL(o,"تمت موافقة الإدارة — بانتظار إصدار PO","الإدارة");
  pushNotif("procurement","📋 "+mrId+" تمت الموافقة — يجب إصدار أمر الشراء PO الآن",mrId,"📋");
  saveData();render();notify("✅ تمت الموافقة — بانتظار إصدار PO من المشتريات","success");
}
function rejectMR(mrId){
  if(!isAdmin())return;
  var mr=S.data.mrs.find(function(m){return m.id===mrId});
  if(!mr)return;
  mr.approved=false;mr.status="مرفوض";
  pushNotif("procurement","❌ تم رفض طلب الشراء "+mrId,mrId,"❌");
  saveData();render();notify("❌ تم رفض "+mrId,"error");
}

function submitPO(){
  var mrId=S.mdata;
  var mr=S.data.mrs.find(function(m){return m.id===mrId});
  if(!mr)return;
  var num=document.getElementById("po-num");
  var date=document.getElementById("po-date");
  var notes=document.getElementById("po-notes");
  var fileIn=document.getElementById("po-file");
  if(!num||!num.value){notify("أدخل رقم PO","error");return}
  var po={number:num.value,date:date?date.value:tod(),notes:notes?notes.value:"",createdBy:S.user.name,createdAt:nowTS()};
  var finish=function(){
    mr.po=po;
    mr.status="تم إصدار PO";
    var o=S.data.orders.find(function(x){return x.id===mr.moId});
    if(o){o.status="شحن";addTL(o,"تم إصدار أمر الشراء PO "+po.number,"المشتريات");addTL(o,"جاهز للشحن","الشحن")}
    pushNotif("procurement","🚛 طلب "+mr.moId+" — تم إصدار PO "+po.number+" — جاهز للشحن",mr.moId,"🚛");
    pushNotif("admin","📋 تم إصدار PO "+po.number+" لطلب "+mrId,mrId,"📋");
    // Email finance/admin
    var admins=S.data.users.filter(function(u){return u.role==="admin"});
    admins.forEach(function(a){sendEmail(a.id,"📋 أمر شراء جديد PO "+po.number,"تم إصدار أمر شراء جديد:\n\nرقم PO: "+po.number+"\nطلب الشراء: "+mrId+"\nالقطعة: "+mr.partName+"\nالكمية: "+mr.qty+"\nالمورد: "+mr.quotes[mr.selectedQuote].supplier+"\nالقيمة: "+mr.quotes[mr.selectedQuote].price+" ريال\nالتاريخ: "+po.date+"\n\nبواسطة: "+S.user.name,"new-task")});
    saveData();closeModal();notify("✅ تم إصدار PO "+po.number+" — أُرسل للوجستك والمالية","success");
  };
  if(fileIn&&fileIn.files&&fileIn.files[0]){
    var f=fileIn.files[0],reader=new FileReader();
    reader.onload=function(e){po.attachment=e.target.result;po.attachmentName=f.name;po.attachmentType=f.type;finish()};
    reader.readAsDataURL(f);
  }else finish();
}

function whConfirmReceipt(shipId){
  var s=S.data.shipments.find(function(x){return x.id===shipId});

  s.status="تم الاستلام";
  var o=S.data.orders.find(function(x){return x.id===s.moId});

  if(!S.data.notifications)S.data.notifications=[];
  S.data.notifications.push({
    id:gid("N"),type:"warehouse-received",moId:s.moId,shipId:s.id,
    message:"تم استلام الشحنة "+s.id+" (طلب "+s.moId+") في المستودع",
    from:S.user.name,to:"procurement",date:tod(),read:false
  });

}

function confirmDelivery(notifId,shipId){
  var s=S.data.shipments.find(function(x){return x.id===shipId});
  if(s){s.status="تم التوصيل";var o=S.data.orders.find(function(x){return x.id===s.moId});if(o){o.status="صيانة";addTL(o,"تم التوصيل وإقفال الشحنة","المشتريات");addTL(o,"وصول للصيانة بعد الشحن","الصيانة");pushNotif("maintenance","🔧 طلب "+o.id+" — "+o.vehicleName+" — القطعة وصلت وجاهز للصيانة",o.id,"🔧")}}
  if(notifId){var n=S.data.notifications.find(function(x){return x.id===notifId});if(n)n.read=true}
  saveData();render();notify("✅ تم إقفال الشحنة وتحويل الطلب للصيانة","success");
}

function confirmDeliveryDirect(shipId){
  confirmDelivery(null,shipId);
}

function readNotif(id){
  var n=S.data.notifications.find(function(x){return x.id===id});

  var stages=["جديد","مستودع","مشتريات","شحن","صيانة","اقفال","مغلق"];

  mo.forEach(function(o){var ds=getOrderDeptStart(o);h+='<tr><td>'+o.id+'</td><td>'+o.vehicleName+'</td><td>'+o.partName+'</td><td>'+bdg(o.type)+'</td><td>'+o.date+'</td><td>'+timerSmall(ds,"ms-"+o.id)+'</td><td><button class="btn btn-ok btn-sm" onclick="compMaint(\''+o.id+'\')">إتمام الصيانة</button></td></tr>'});
  if(!mo.length)h+='<tr><td colspan="7" style="padding:30px;text-align:center;color:var(--textDim)">لا توجد طلبات</td></tr>';
  h+='</tbody></table></div>';
  h+='<div class="card"><h3>مسار جميع الطلبات</h3>';
  d.orders.forEach(function(o){
    var ci=stages.indexOf(o.status);

function delWorker(id){
  var w=S.data.workers.find(function(x){return x.id===id});

  saveData();render();
}

var CITIES=["جدة","الرياض","النجيل","العلا","أمالا (الوجه)"];

function pgInspection(){
  var d=S.data;if(!d.inspections)d.inspections=[];
  var inspections=d.inspections;
  // Alerts count
  var totalAlerts=0;
  inspections.forEach(function(ins){
    Object.keys(ins.items).forEach(function(k){if(ins.items[k]===0)totalAlerts++});
  });

  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px"><div style="font-size:14px;color:var(--textMuted)">تقارير الفحص: '+inspections.length+'</div><button class="btn btn-p" onclick="openModal(\'new-inspection\')">'+I.plus+' فحص سكن جديد</button></div>';

  // Alert Summary
  if(totalAlerts>0){
    h+='<div class="card" style="border-color:rgba(239,68,68,.4);background:linear-gradient(135deg,rgba(239,68,68,.06),rgba(239,68,68,.02))"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="font-size:24px">⚠️</span><div><div style="font-size:16px;font-weight:700;color:var(--danger)">تنبيهات تحتاج معالجة: '+totalAlerts+'</div><div style="font-size:12px;color:var(--textMuted)">بنود لم تجتز الفحص وتحتاج إجراء عاجل</div></div></div>';
    inspections.forEach(function(ins){
      var ho=d.housing.find(function(x){return x.id===ins.housingId});
      var fails=[];
      INSP_CATS.forEach(function(cat){cat.items.forEach(function(item){
        if(ins.items[item.key]===0)fails.push({cat:cat.title,q:item.q,note:ins.notes[item.key]||"",color:cat.color});
      })});
      if(fails.length){
        h+='<div style="margin-top:10px;padding:12px;border-radius:8px;background:var(--bgCard2)"><div style="font-weight:600;font-size:14px;margin-bottom:8px">'+(ho?ho.name:ins.housingId)+' <span style="font-size:12px;color:var(--textDim)">('+ins.date+')</span></div>';
        fails.forEach(function(f){
          h+='<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;padding:8px;border-radius:6px;background:rgba(239,68,68,.06);border-right:3px solid '+f.color+'"><span style="color:#ef4444;font-weight:700;flex-shrink:0">✗</span><div><div style="font-size:12px;font-weight:600">'+f.cat+'</div><div style="font-size:12px;color:var(--textMuted)">'+f.q+'</div>';
          if(f.note)h+='<div style="font-size:11px;color:var(--danger);margin-top:2px">📝 '+f.note+'</div>';
          h+='</div></div>';
        });
        h+='</div>';
      }
    });
    h+='</div>';
  }

  // City filter tabs
  h+='<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap"><button class="btn btn-sm '+(S._inspCity?'btn-s':'btn-p')+'" onclick="S._inspCity=null;render()">الكل</button>';
  CITIES.forEach(function(c){h+='<button class="btn btn-sm '+(S._inspCity===c?'btn-p':'btn-s')+'" onclick="S._inspCity=\''+c+'\';render()">'+c+'</button>'});
  h+='</div>';

  // Inspection cards
  var filtered=inspections;
  if(S._inspCity)filtered=inspections.filter(function(ins){return ins.city===S._inspCity});

  if(filtered.length===0)h+='<div class="card" style="text-align:center;padding:40px;color:var(--textDim)">لا توجد تقارير فحص'+(S._inspCity?' لـ '+S._inspCity:'')+'</div>';

  filtered.forEach(function(ins){
    var ho=d.housing.find(function(x){return x.id===ins.housingId});
    var totalItems=0,passItems=0,failItems=0;
    Object.keys(ins.items).forEach(function(k){totalItems++;if(ins.items[k]===1)passItems++;else failItems++});
    var pct=totalItems?Math.round(passItems/totalItems*100):0;
    var pctColor=pct>=80?"#22c55e":pct>=60?"#f59e0b":"#ef4444";

    h+='<div class="card" style="position:relative;overflow:hidden"><div style="position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,'+pctColor+',transparent)"></div>';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px">';
    h+='<div><div style="font-size:16px;font-weight:700">'+(ho?ho.name:ins.housingId)+'</div><div style="font-size:12px;color:var(--textMuted)">📍 '+(ho?ho.location:"")+' | 📅 '+ins.date+' | 👤 '+ins.inspector+'</div>';
    if(ho)h+='<div style="font-size:11px;color:var(--textDim);margin-top:2px">الملكية: '+(ho.ownership==="ملك"?"<b style=\'color:#22c55e\'>ملك</b>":"إيجار "+(ho.rent?ho.rent.toLocaleString()+" ريال":""))+' | العمال: '+(ins.workerCount||"—")+'</div>';
    h+='</div>';
    h+='<div style="text-align:center"><div style="width:64px;height:64px;border-radius:50%;border:4px solid '+pctColor+';display:flex;align-items:center;justify-content:center"><span style="font-size:18px;font-weight:800;color:'+pctColor+'">'+pct+'%</span></div><div style="font-size:11px;color:var(--textMuted);margin-top:4px">'+passItems+'✓ / '+failItems+'✗</div></div></div>';

    // Category bars
    h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">';
    INSP_CATS.forEach(function(cat){
      var catPass=0,catTotal=0;
      cat.items.forEach(function(item){if(ins.items.hasOwnProperty(item.key)){catTotal++;if(ins.items[item.key]===1)catPass++}});
      var catPct=catTotal?Math.round(catPass/catTotal*100):0;
      h+='<div style="flex:1;min-width:120px;padding:8px;border-radius:6px;background:var(--bgCard2);border-right:3px solid '+cat.color+'"><div style="font-size:11px;font-weight:600;color:'+cat.color+'">'+cat.title+'</div><div style="display:flex;align-items:center;gap:6px;margin-top:4px"><div style="flex:1;height:4px;border-radius:2px;background:var(--border)"><div style="height:100%;border-radius:2px;width:'+catPct+'%;background:'+cat.color+'"></div></div><span style="font-size:10px;font-weight:700;color:var(--textMuted)">'+catPct+'%</span></div></div>';
    });
    h+='</div>';

    h+='<div style="display:flex;gap:6px"><button class="btn btn-s btn-sm" onclick="openModal(\'view-insp\',\''+ins.id+'\')">'+I.eye+' عرض التقرير</button><button class="btn btn-no btn-sm" onclick="delInspection(\''+ins.id+'\')">'+I.trash+' حذف</button></div>';
    h+='</div>';
  });

  // Equipment section from latest
  if(inspections.length&&inspections[inspections.length-1].equipment){
    var eq=inspections[inspections.length-1].equipment;
    h+='<div class="card"><h3>الأدوات داخل السكن (آخر فحص)</h3><table><thead><tr><th>الأداة</th><th>العدد</th><th>الحالة</th><th>ملاحظات</th></tr></thead><tbody>';
    [["عدد الغسالات",eq.washers],["عدد المكيفات",eq.acs],["عدد الثلاجات",eq.fridges],["عدد الأفران والغاز",eq.stoves]].forEach(function(x){
      var item=x[1]||{count:0,status:"—"};
      h+='<tr><td>'+x[0]+'</td><td>'+item.count+'</td><td>'+item.status+'</td><td style="font-size:12px;color:var(--textDim)">'+(inspections[inspections.length-1].equipNotes||"")+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  return h;
}

function delInspection(id){
  if(!S.data.inspections)return;
  S.data.inspections=S.data.inspections.filter(function(x){return x.id!==id});
  saveData();render();

function pgFleetCat(){
  var d=S.data;if(!d.transfers)d.transfers=[];
  var cats={"معدات":[],"تريلات":[],"سيارات":[]};
  d.fleet.forEach(function(v){var c=v.category||"أخرى";if(!cats[c])cats[c]=[];cats[c].push(v)});

  var catIcons={"معدات":"⚙️","تريلات":"🚛","سيارات":"🚗"};

  var active=d.fleet.filter(function(v){return v.status==="نشط"}).length;

  // Availability per category
  h+='<div class="charts-grid">';

    var projects={};items.forEach(function(v){var p=v.project||"غير محدد";if(!projects[p])projects[p]=[];projects[p].push(v)});
    Object.keys(projects).forEach(function(proj){
      h+='<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:var(--textMuted);margin-bottom:4px;padding:4px 8px;background:var(--bg);border-radius:4px;display:inline-block">📍 '+proj+'</div><div style="display:flex;flex-wrap:wrap;gap:4px">';
      projects[proj].forEach(function(v){

  d.fleet.forEach(function(v){
    var color=catColors[v.category]||"var(--textMuted)";
    h+='<tr><td>'+v.id+'</td><td style="font-weight:600">'+v.name+'</td><td><span class="badge" style="background:'+color+'18;color:'+color+';border:1px solid '+color+'33">'+(v.category||"—")+'</span></td><td>'+v.type+'</td><td>'+v.plate+'</td><td style="font-size:12px">'+(v.project||"—")+'</td><td>'+(v.location||"—")+'</td><td>'+(v.driver||"—")+'</td><td>'+v.km.toLocaleString()+' كم</td><td>'+bdg(v.status)+'</td></tr>';
  });
  h+='</tbody></table></div>';

  // Transfer history
  if(d.transfers.length){
    h+='<div class="card"><h3>سجل نقل المعدات</h3><table><thead><tr><th>الرقم</th><th>المعدة</th><th>من مشروع</th><th>إلى مشروع</th><th>من مدينة</th><th>إلى مدينة</th><th>التاريخ</th><th>بواسطة</th></tr></thead><tbody>';

    h+='</tbody></table></div>';
  }
  return h;
}

function pgTasks(){
  var d=S.data;if(!d.tasks)d.tasks=[];
  var manager=isManager();

  // Filter logic:
  // - Admin: sees all tasks
  // - Manager: sees only their employees' tasks + tasks they assigned
  // - Employee: sees ONLY their own tasks
  var visibleTasks;
  if(isAdmin()){
    visibleTasks=d.tasks;
  }else if(S.user.isManager){
    var myEmpIds=getMyEmployees().map(function(e){return e.id});
    myEmpIds.push(S.user.id);
    visibleTasks=d.tasks.filter(function(t){return myEmpIds.indexOf(t.assignedTo)>=0});
  }else{
    visibleTasks=d.tasks.filter(function(t){return t.assignedTo===S.user.id});
  }

  // Stats
  var total=visibleTasks.length;
  var done=visibleTasks.filter(function(t){return t.status==="مكتملة"}).length;
  var inProgress=visibleTasks.filter(function(t){return t.status==="قيد التنفيذ"}).length;
  var overdue=visibleTasks.filter(function(t){return t.status!=="مكتملة"&&new Date(t.dueDate)<new Date()}).length;
  var avgProgress=total?Math.round(visibleTasks.reduce(function(a,t){return a+(t.progress||0)},0)/total):0;

  var roleLabel=isAdmin()?"كل المهام (مدير النظام)":S.user.isManager?"مهام موظفيك ("+getMyEmployees().length+" موظف)":"مهامي الشخصية";
  var h='<div class="card" style="margin-bottom:20px;background:linear-gradient(135deg,rgba(10,90,140,.12),rgba(10,138,140,.06));border-color:rgba(14,165,183,.3);padding:14px 20px"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:18px">'+(isAdmin()?"👑":S.user.isManager?"👨‍💼":"👤")+'</span><div><div style="font-size:14px;font-weight:700">'+roleLabel+'</div><div style="font-size:12px;color:var(--textMuted)">'+(S.user.isManager?"يمكنك إضافة مهام لموظفيك":"يمكنك تحديث تقدم مهامك فقط")+'</div></div></div></div>';

  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px"><div style="font-size:14px;color:var(--textMuted)">المهام المعروضة: '+total+'</div><div style="display:flex;gap:8px">';
  if(manager)h+='<button class="btn btn-p" onclick="openModal(\'add-task\')">'+I.plus+' إضافة مهمة</button>';
  h+='<button class="btn btn-s" onclick="S._taskView=\'month\';render()">'+I.calendar+' عرض شهري</button><button class="btn btn-s" onclick="S._taskView=\'list\';render()">📋 قائمة</button></div></div>';

  // Stats
  h+='<div class="stats-grid">'+statCard("الإجمالي",total,I.tasks,"#3b82f6")+statCard("مكتملة",done,I.check,"#22c55e")+statCard("قيد التنفيذ",inProgress,I.status,"#f59e0b")+statCard("متأخرة",overdue,I.alert,"#ef4444")+statCard("نسبة الإنجاز",avgProgress+"%",I.dashboard,avgProgress>=70?"#22c55e":avgProgress>=40?"#f59e0b":"#ef4444")+'</div>';

  // Manager view: per-employee progress summary
  if(S.user.isManager&&!isAdmin()){
    var emps=getMyEmployees();
    if(emps.length){
      h+='<div class="card"><h3>📊 تقدم فريقك</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">';
      emps.forEach(function(e){
        var et=visibleTasks.filter(function(t){return t.assignedTo===e.id});
        var ed=et.filter(function(t){return t.status==="مكتملة"}).length;
        var ep=et.length?Math.round(et.reduce(function(a,t){return a+(t.progress||0)},0)/et.length):0;
        var color=ep>=70?"#22c55e":ep>=40?"#f59e0b":"#ef4444";
        h+='<div style="padding:14px;border-radius:10px;background:var(--bgCard2);border-right:3px solid '+color+'"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div style="font-size:14px;font-weight:700">'+e.name+'</div><div style="font-size:11px;color:var(--textDim)">'+e.email+'</div></div><span style="font-size:18px;font-weight:800;color:'+color+'">'+ep+'%</span></div><div style="display:flex;gap:8px;font-size:11px;color:var(--textMuted);margin-bottom:6px"><span>📋 '+et.length+' مهمة</span><span>✅ '+ed+' مكتملة</span></div><div style="height:6px;border-radius:3px;background:var(--border)"><div style="height:100%;width:'+ep+'%;background:'+color+';border-radius:3px"></div></div></div>';
      });
      h+='</div></div>';
    }
  }

  if(S._taskView==="month"){
    h+=renderCalendar(visibleTasks);
  }else{
    ["يومية","أسبوعية","شهرية","غير مجدولة"].forEach(function(freq){
      var ftasks=visibleTasks.filter(function(t){return (t.frequency||"غير مجدولة")===freq});
      if(!ftasks.length)return;
      h+='<div class="card"><h3>📌 '+freq+' ('+ftasks.length+')</h3><div style="display:grid;gap:10px">';
      ftasks.forEach(function(t){
        var prio={"عاجلة":"#ef4444","عالية":"#f59e0b","متوسطة":"#3b82f6","منخفضة":"#22c55e"}[t.priority]||"#94a3b8";
        var isOverdueT=t.status!=="مكتملة"&&new Date(t.dueDate)<new Date();
        var canEdit=isAdmin()||t.assignedTo===S.user.id||(S.user.isManager&&isMyEmployee(t.assignedTo));
        h+='<div style="padding:14px;border-radius:10px;background:var(--bgCard2);border-right:3px solid '+prio+'">';
        h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:200px">';
        h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap"><span style="font-size:14px;font-weight:700">'+t.title+'</span>'+bdg(t.status)+'<span class="badge" style="background:'+prio+'18;color:'+prio+';border:1px solid '+prio+'33">'+t.priority+'</span>'+(isOverdueT?'<span class="badge" style="background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3)">⚠️ متأخرة</span>':'')+'</div>';
        h+='<div style="font-size:12px;color:var(--textMuted)">👤 '+t.assignedToName+' | 📅 '+t.date+' → '+t.dueDate+(t.assignedBy?' | بواسطة: '+t.assignedBy:'')+'</div>';
        if(t.description)h+='<div style="font-size:11px;color:var(--textDim);margin-top:4px">'+t.description+'</div>';
        h+='</div>';
        h+='<div style="min-width:180px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--textMuted);margin-bottom:4px"><span>التقدم</span><span style="font-weight:700">'+(t.progress||0)+'%</span></div><div style="height:8px;border-radius:4px;background:var(--border);overflow:hidden"><div style="height:100%;width:'+(t.progress||0)+'%;background:'+(t.progress>=70?'#22c55e':t.progress>=40?'#f59e0b':'#ef4444')+';transition:width .5s"></div></div>';
        if(canEdit){
          h+='<div style="display:flex;gap:4px;margin-top:8px"><button class="btn btn-s btn-sm" onclick="updateProgress(\''+t.id+'\')" style="flex:1;font-size:11px">📊 تحديث</button>';
          if(isAdmin()||S.user.isManager)h+='<button class="btn btn-s btn-sm" onclick="remindTask(\''+t.id+'\')" style="font-size:11px" title="إرسال تذكير">📧</button><button class="btn-icon" onclick="delTask(\''+t.id+'\')" style="color:var(--danger)">'+I.trash+'</button>';
          h+='</div>';
        }
        h+='</div></div></div>';
      });
      h+='</div></div>';
    });
    if(!visibleTasks.length)h+='<div class="card" style="text-align:center;padding:40px;color:var(--textDim)">لا توجد مهام'+(S.user.isManager?'':' مسندة إليك')+'</div>';
  }
  return h;
}

function remindTask(tid){
  var t=S.data.tasks.find(function(x){return x.id===tid});
  if(!t)return;
  sendEmail(t.assignedTo,"📧 تذكير: "+t.title,"تذكير بالمهمة المسندة إليك:\n\n"+t.title+"\n"+(t.description||"")+"\n\nموعد التسليم: "+t.dueDate+"\nالأولوية: "+t.priority+"\n\nالتقدم الحالي: "+(t.progress||0)+"%","reminder");
  pushNotif(t.dept,"📧 تذكير من "+S.user.name+" بخصوص مهمة: "+t.title,t.id,"📧");
  notify("✅ تم إرسال التذكير بالإيميل","success");
}

function renderCalendar(tasks){
  var now=S._calMonth?new Date(S._calMonth):new Date();
  var year=now.getFullYear(),month=now.getMonth();
  var firstDay=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var monthNames=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  var dayNames=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

  var h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h3 style="margin:0">📅 '+monthNames[month]+' '+year+'</h3><div style="display:flex;gap:6px"><button class="btn btn-s btn-sm" onclick="navMonth(-1)">← السابق</button><button class="btn btn-s btn-sm" onclick="navMonth(0)">اليوم</button><button class="btn btn-s btn-sm" onclick="navMonth(1)">التالي →</button></div></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">';
  dayNames.forEach(function(dn){h+='<div style="padding:8px;text-align:center;font-size:11px;font-weight:700;color:var(--primaryLight);background:var(--bgCard2);border-radius:6px">'+dn+'</div>'});
  for(var i=0;i<firstDay;i++)h+='<div></div>';
  var todayStr=tod();
  for(var day=1;day<=daysInMonth;day++){
    var dateStr=year+"-"+pad(month+1)+"-"+pad(day);
    var dayTasks=tasks.filter(function(t){return t.date<=dateStr&&t.dueDate>=dateStr});
    var isToday=dateStr===todayStr;
    h+='<div style="min-height:90px;padding:6px;border-radius:6px;background:var(--bgCard2);border:'+(isToday?'2px solid var(--primaryLight)':'1px solid var(--border)')+'">';
    h+='<div style="font-size:12px;font-weight:'+(isToday?'800':'600')+';color:'+(isToday?'var(--primaryLight)':'var(--text)')+';margin-bottom:4px">'+day+'</div>';
    dayTasks.slice(0,3).forEach(function(t){
      var prio={"عاجلة":"#ef4444","عالية":"#f59e0b","متوسطة":"#3b82f6","منخفضة":"#22c55e"}[t.priority]||"#94a3b8";
      h+='<div style="font-size:9px;padding:2px 4px;margin-bottom:2px;border-radius:3px;background:'+prio+'22;color:'+prio+';border-right:2px solid '+prio+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+t.title+' - '+t.assignedToName+'">'+t.title+'</div>';
    });
    if(dayTasks.length>3)h+='<div style="font-size:9px;color:var(--textDim);text-align:center">+'+(dayTasks.length-3)+'</div>';
    h+='</div>';
  }
  h+='</div></div>';
  return h;
}

function navMonth(dir){
  var cur=S._calMonth?new Date(S._calMonth):new Date();
  if(dir===0)cur=new Date();
  else cur.setMonth(cur.getMonth()+dir);
  S._calMonth=cur.toISOString();
  render();
}

function updateProgress(tid){
  var t=S.data.tasks.find(function(x){return x.id===tid});
  if(!t)return;
  // Only assignee or manager/admin can update
  if(t.assignedTo!==S.user.id&&!isAdmin()&&!(S.user.isManager&&isMyEmployee(t.assignedTo))){notify("ليس لديك صلاحية","error");return}
  var p=prompt("نسبة الإنجاز الجديدة (0-100):",t.progress||0);
  if(p===null)return;
  var oldP=t.progress||0;
  t.progress=Math.max(0,Math.min(100,Number(p)||0));
  if(t.progress>=100){t.status="مكتملة";pushNotif(t.dept,"✅ تم إنجاز المهمة: "+t.title,t.id,"✅")}
  else if(t.progress>0)t.status="قيد التنفيذ";
  // Email manager about progress change
  var u=S.data.users.find(function(x){return x.id===t.assignedTo});
  if(u&&u.managerId){
    var subj=t.progress>=100?"✅ تم إنجاز المهمة: "+t.title:"📊 تحديث تقدم: "+t.title;
    var body="تحديث على المهمة:\n\nالعنوان: "+t.title+"\nالموظف: "+u.name+"\nالتقدم السابق: "+oldP+"%\nالتقدم الحالي: "+t.progress+"%\nالحالة: "+t.status;
    sendEmail(u.managerId,subj,body,"progress");
  }
  saveData();render();notify("✅ تم التحديث وإرسال إيميل للمسؤول","success");
}

function delTask(tid){
  S.data.tasks=S.data.tasks.filter(function(t){return t.id!==tid});
  saveData();render();
}

function submitTask(){
  var title=document.getElementById("tk-title");
  var assignedTo=document.getElementById("tk-user");
  var dept=document.getElementById("tk-dept");
  var date=document.getElementById("tk-date");
  var due=document.getElementById("tk-due");
  var freq=document.getElementById("tk-freq");
  var prio=document.getElementById("tk-prio");
  var desc=document.getElementById("tk-desc");
  if(!title||!title.value||!assignedTo||!assignedTo.value)return;
  var u=S.data.users.find(function(x){return x.id===Number(assignedTo.value)});
  if(!S.data.tasks)S.data.tasks=[];
  S.data.tasks.push({

function updateProjectProgress(pid){
  var p=S.data.projects.find(function(x){return x.id===pid});
  if(!p)return;
  var v=prompt("نسبة تقدم المشروع الجديدة (0-100):",p.progress||0);
  if(v===null)return;
  p.progress=Math.max(0,Math.min(100,Number(v)||0));
  if(p.progress>=100)p.status="مكتمل";
  saveData();render();notify("✅ تم التحديث","success");
}

function delProject(pid){
  S.data.projects=S.data.projects.filter(function(p){return p.id!==pid});
  saveData();render();
}

function exportD(k,fmt){
  var d=S.data,obj,title="";
  if(k==="orders"){obj=d.orders.map(function(o){var r={};r["رقم الطلب"]=o.id;r["المركبة"]=o.vehicleName;r["النوع"]=o.type;r["السبب"]=o.reason;r["القطعة"]=o.partName;r["الحالة"]=o.status;r["التاريخ"]=o.date;r["تاريخ الإغلاق"]=o.closedDate||"—";r["الأيام"]=o.days;r["الساعات الكلية"]=o.totalHrs||"—";r["الوصف"]=o.description;if(o.timeline)o.timeline.forEach(function(t,i){r["خطوة "+(i+1)]=t.step+" ("+t.dept+") "+new Date(t.at).toLocaleString("ar-SA")});return r});title="أوامر الصيانة"}
  else if(k==="fleet"){obj=d.fleet.map(function(v){return{"الكود":v.id,"الاسم":v.name,"التصنيف":v.category,"النوع":v.type,"اللوحة":v.plate,"الموديل":v.model,"العداد":v.km,"السائق":v.driver||"—","الموقع":v.location||"—","المشروع":v.project||"—","الحالة":v.status}});title="الأسطول"}
  else if(k==="parts"){obj=d.parts.map(function(p){return{"الكود":p.id,"الاسم":p.name,"الفئة":p.category,"الكمية":p.qty,"الحد الأدنى":p.minQty,"متوفر":p.available?"نعم":"لا","الموقع":p.location}});title="قطع الغيار"}
  else if(k==="mrs"){obj=d.mrs.map(function(m){return{"الرقم":m.id,"طلب الصيانة":m.moId,"القطعة":m.partName,"الكمية":m.qty,"الحالة":m.status,"التاريخ":m.date,"عدد العروض":m.quotes.length,"الموافقة":m.approved===null?"معلق":m.approved?"نعم":"مرفوض"}});title="طلبات الشراء"}
  else if(k==="logins"){obj=(d.loginHistory||[]).map(function(l){var dt=new Date(l.at);return{"التاريخ":dt.toLocaleDateString("ar-SA"),"الوقت":dt.toLocaleTimeString("ar-SA"),"المستخدم":l.username,"الاسم":l.name,"القسم":l.dept,"الصلاحية":l.role,"الجهاز":l.device}});title="سجل الدخول"}
  else if(k==="all"){obj=null;title="جميع البيانات"}
  else return;

  if(fmt==="json"){
    var data=k==="all"?{orders:d.orders,fleet:d.fleet,parts:d.parts,mrs:d.mrs,shipments:d.shipments,loginHistory:d.loginHistory}:obj;
    dlBlob(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),k+"_"+tod()+".json");
  }
  else if(fmt==="csv"&&obj){
    var hd=Object.keys(obj[0]||{});
    var rows=obj.map(function(r){return hd.map(function(h){var v=r[h];v=v==null?"":String(v);if(v.indexOf(",")>=0||v.indexOf('"')>=0||v.indexOf("\n")>=0)v='"'+v.replace(/"/g,'""')+'"';return v}).join(",")});
    dlBlob(new Blob(["\uFEFF"+hd.join(",")+"\n"+rows.join("\n")],{type:"text/csv;charset=utf-8"}),k+"_"+tod()+".csv");
    notify("📊 تم تحميل "+title+" — Excel CSV","success");
  }
  else if(fmt==="word"){
    if(k==="all"){exportD("orders","word");exportD("fleet","word");return}
    if(!obj||!obj.length)return;
    var hd=Object.keys(obj[0]);
    var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{direction:rtl;font-family:Tahoma,sans-serif;font-size:12px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #333;padding:6px 10px;text-align:right}th{background:#0a5a8c;color:#fff;font-weight:bold}tr:nth-child(even){background:#f0f0f0}h1{color:#0a5a8c;font-size:18px;margin-bottom:10px}p{color:#666;font-size:11px}</style></head><body><h1>'+title+'</h1><p>تاريخ التصدير: '+new Date().toLocaleString("ar-SA")+'</p><table><thead><tr>';
    hd.forEach(function(h){html+='<th>'+h+'</th>'});
    html+='</tr></thead><tbody>';
    obj.forEach(function(r){html+='<tr>';hd.forEach(function(h){html+='<td>'+(r[h]==null?"":r[h])+'</td>'});html+='</tr>'});
    html+='</tbody></table></body></html>';
    dlBlob(new Blob([html],{type:"application/msword"}),title+"_"+tod()+".doc");
    notify("📄 تم تحميل "+title+" — Word","success");
  }
}
function dlBlob(b,fn){var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u)}

function submitInspection(){
  var hid=document.getElementById("ins-housing"),insp=document.getElementById("ins-inspector"),wc=document.getElementById("ins-wcount"),dt=document.getElementById("ins-date");

  var ho=S.data.housing.find(function(x){return x.id===hid.value});
  var items={},notes={};
  INSP_CATS.forEach(function(cat){cat.items.forEach(function(item){
    items[item.key]=_inspVals.hasOwnProperty(item.key)?_inspVals[item.key]:1;
    var noteEl=document.getElementById("note-"+item.key);
    if(noteEl&&noteEl.value)notes[item.key]=noteEl.value;
  })});
  var equipment={
    washers:{count:Number((document.getElementById("eq-washers-count")||{}).value)||0,status:(document.getElementById("eq-washers-status")||{}).value||"—"},
    acs:{count:Number((document.getElementById("eq-acs-count")||{}).value)||0,status:(document.getElementById("eq-acs-status")||{}).value||"—"},

    stoves:{count:Number((document.getElementById("eq-stoves-count")||{}).value)||0,status:(document.getElementById("eq-stoves-status")||{}).value||"—"}
  };
  var eqNotes=(document.getElementById("eq-notes")||{}).value||"";
  if(!S.data.inspections)S.data.inspections=[];
  S.data.inspections.push({
    id:gid("INS"),housingId:hid.value,date:dt?dt.value:tod(),inspector:insp?insp.value:"",
    city:ho?ho.city:"",workerCount:wc?Number(wc.value)||0:0,

  });
  _inspVals={};
  saveData();closeModal();
  var fails=0;Object.keys(items).forEach(function(k){if(items[k]===0)fails++});

function submitForgotPw(){
  var em=document.getElementById("fp-email");
  var msg=document.getElementById("fp-msg");
  if(!em||!em.value){if(msg)msg.innerHTML='<div style="padding:10px;border-radius:8px;background:rgba(239,68,68,0.1);color:var(--danger);font-size:12px;margin:10px 0">⚠️ أدخل البريد الإلكتروني</div>';return}
  var email=em.value.trim().toLowerCase();
  // Auto-append @unbrc.com if user only typed username
  if(email.indexOf("@")<0)email=email+"@unbrc.com";
  if(email.indexOf("@unbrc.com")<0){if(msg)msg.innerHTML='<div style="padding:10px;border-radius:8px;background:rgba(239,68,68,0.1);color:var(--danger);font-size:12px;margin:10px 0">⚠️ يجب استخدام بريد الشركة @unbrc.com فقط</div>';return}
  var user=S.data.users.find(function(u){return u.email&&u.email.toLowerCase()===email});
  if(!user){if(msg)msg.innerHTML='<div style="padding:10px;border-radius:8px;background:rgba(245,158,11,0.1);color:var(--warning);font-size:12px;margin:10px 0">⚠️ البريد غير مسجل في النظام<br><small style="color:var(--textDim)">جرّب: '+(S.data.users[0].email||"admin@unbrc.com")+'</small></div>';return}
  // Generate 6-char token
  var chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",token="";
  for(var i=0;i<6;i++)token+=chars.charAt(Math.floor(Math.random()*chars.length));
  S._fpToken=token;
  S._fpUserId=user.id;
  S._fpEmail=email;
  S._fpStep=2;
  // Log the email for record
  sendEmail(user.id,"🔑 رمز استعادة كلمة المرور","مرحباً "+user.name+"،\n\nرمز التحقق الخاص بك: "+token+"\n\nهذا الرمز صالح لمدة 30 دقيقة.\n\nمع تحيات،\nفريق UNBRC","reminder");
  saveData();render();
}

  if(code.value.trim().toUpperCase()!==S._fpToken){

    return;
  }
  S._fpStep=3;render();
}

function resetPassword(){
  var pw1=document.getElementById("fp-newpw");
  var pw2=document.getElementById("fp-confirm");
  var msg=document.getElementById("fp-msg3");
  if(!pw1||!pw1.value||pw1.value.length<4){msg.innerHTML='<div style="padding:10px;border-radius:8px;background:rgba(239,68,68,0.1);color:var(--danger);font-size:12px;margin:10px 0">⚠️ كلمة المرور يجب 4 أحرف على الأقل</div>';return}
  if(pw1.value!==pw2.value){msg.innerHTML='<div style="padding:10px;border-radius:8px;background:rgba(239,68,68,0.1);color:var(--danger);font-size:12px;margin:10px 0">⚠️ كلمتا المرور غير متطابقتين</div>';return}
  var user=S.data.users.find(function(u){return u.id===S._fpUserId});
  if(!user)return;
  user.password=pw1.value;
  saveData();
  S._fpStep=1;S._fpToken=null;S._fpUserId=null;S._fpEmail=null;
  closeModal();
  notify("✅ تم تغيير كلمة المرور بنجاح — يمكنك الآن تسجيل الدخول","success");
}

function submitEditMO(){
  if(!confirm("⚠️ هل أنت متأكد من حفظ التعديلات على هذا الطلب؟"))return;
  var o=S.data.orders.find(function(x){return x.id===S.mdata});
  if(!o)return;
  var v=document.getElementById("em-v");
  if(v&&v.value){var veh=S.data.fleet.find(function(x){return x.id===v.value});if(veh){o.vehicleId=veh.id;o.vehicleName=veh.name}}
  var t=document.getElementById("em-t");if(t)o.type=t.value;
  var r=document.getElementById("em-r");if(r)o.reason=r.value;
  var st=document.getElementById("em-st");if(st)o.status=st.value;
  var p=document.getElementById("em-p");if(p&&p.value){var part=S.data.parts.find(function(x){return x.id===p.value});if(part){o.partId=part.id;o.partName=part.name}}
  var pk=document.getElementById("em-pk");if(pk)o.prevKm=Number(pk.value)||0;
  var ck=document.getElementById("em-ck");if(ck)o.currKm=Number(ck.value)||0;
  var d=document.getElementById("em-d");if(d)o.description=d.value;
  addTL(o,"تم تعديل الطلب",o.status);
  saveData();closeModal();notify("✅ تم حفظ التعديلات بنجاح","success");
}

function confirmDelOrder(id){
  if(!confirm("⚠️ هل أنت متأكد من حذف الطلب "+id+"؟ هذا الإجراء لا يمكن التراجع عنه."))return;
  S.data.orders=S.data.orders.filter(function(x){return x.id!==id});
  // Also remove related MRs
  S.data.mrs=S.data.mrs.filter(function(m){return m.moId!==id});
  saveData();closeModal();notify("✅ تم حذف الطلب","success");
}

function submitEditProject(){
  if(!confirm("⚠️ هل أنت متأكد من حفظ التعديلات على هذا المشروع؟"))return;
  var p=S.data.projects.find(function(x){return x.id===S.mdata});
  if(!p)return;
  var nm=document.getElementById("ep-name");if(nm)p.name=nm.value;
  var city=document.getElementById("ep-city");if(city)p.city=city.value;
  var mgr=document.getElementById("ep-mgr");if(mgr)p.manager=mgr.value;
  var lat=document.getElementById("ep-lat");if(lat&&lat.value)p.lat=Number(lat.value);
  var lng=document.getElementById("ep-lng");if(lng&&lng.value)p.lng=Number(lng.value);
  var sd=document.getElementById("ep-sd");if(sd)p.startDate=sd.value;
  var ed=document.getElementById("ep-ed");if(ed)p.endDate=ed.value;
  var bud=document.getElementById("ep-bud");if(bud)p.budget=Number(bud.value)||0;
  var st=document.getElementById("ep-st");if(st)p.status=st.value;
  var prog=document.getElementById("ep-prog");if(prog)p.progress=Math.max(0,Math.min(100,Number(prog.value)||0));
  var desc=document.getElementById("ep-desc");if(desc)p.description=desc.value;
  saveData();closeModal();notify("✅ تم حفظ تعديلات المشروع","success");
}

</script><script>
(function(){

  window.doLogin=function(){var u=document.getElementById("lu").value;var p=document.getElementById("lp").value;fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({username:u,password:p})}).then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d}})}).then(function(res){if(res.ok&&res.data.user){S.user=res.data.user;S.modal=null;S.mdata=null;fetchAllData(function(){origRender()})}else{var e=document.getElementById("lerr");if(e)e.innerHTML='<div style="padding:8px 12px;border-radius:8px;background:rgba(239,68,68,.1);color:var(--danger);font-size:13px;margin-bottom:14px">⚠️ '+(res.data.error||"خطأ")+'</div>'}})};
  window.doLogout=function(){fetch("/api/logout",{method:"POST",credentials:"same-origin"}).then(function(){S.user=null;S.page="dashboard";S.modal=null;S.mdata=null;S.data=JSON.parse(JSON.stringify(DB));origRender()})};
  window.submitForgotPw=function(){var em=document.getElementById("fp-email"),msg=document.getElementById("fp-msg");if(!em||!em.value){if(msg)msg.innerHTML='<div style="padding:10px;border-radius:8px;background:rgba(239,68,68,0.1);color:var(--danger);font-size:12px;margin:10px 0">⚠️ أدخل البريد</div>';return}var email=em.value.trim().toLowerCase();if(email.indexOf("@")<0)email=email+"@unbrc.com";fetch("/api/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email:email})}).then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d}})}).then(function(res){if(res.ok){S._fpToken=res.data.token;S._fpUserId=res.data.userId;S._fpStep=2;origRender()}else if(msg)msg.innerHTML='<div style="padding:10px;border-radius:8px;background:rgba(239,68,68,0.1);color:var(--danger);font-size:12px;margin:10px 0">⚠️ '+res.data.error+'</div>'})};

})();
